name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m robustlab demo > /tmp/demo.json
      - run: PYTHONPATH=. python examples/render_audit.py --check
      - run: python -m robustlab exact-demo > /tmp/exact-demo.json
      - run: PYTHONPATH=. python examples/render_exact.py --check
      - run: python -m robustlab exact-audit examples/model.json examples/data.json --norm linf --epsilon 0.1
      - run: python -m robustlab audit examples/model.json examples/data.json --norm l2 --epsilon 0.4
      - run: python -m robustlab fit examples/data.json --norm linf --epsilon 0.3 --steps 100
      - run: python -m robustlab box-demo > /tmp/box-demo.json
      - run: PYTHONPATH=. python examples/render_box.py --check
      - run: python -m robustlab box-audit examples/model.json examples/data.json examples/bounds.json --norm l1 --epsilon 0.3
